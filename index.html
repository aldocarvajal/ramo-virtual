<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Un ramo para ti 💙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="petals" id="petals"></div>
  <div class="fx" id="fx"></div>

  <!-- Pantalla de inicio -->
  <section class="intro" id="intro">
    <p class="intro-small">Hay algo que quiero regalarte</p>
    <h1 id="introTitle">Para ti</h1>
    <button class="open-btn" id="openBtn">Abrir mi regalo</button>
  </section>

  <!-- Escena -->
  <main class="scene" id="scene" aria-hidden="true">
    <div class="rays"></div>
    <div class="glow"></div>

    <div class="tilt" id="tilt">
      <div class="bouquet">
        <!-- Hojas, gypsophila y tallos (los genera el JS) -->
        <svg class="greens" id="greens" viewBox="0 0 340 560" aria-hidden="true"></svg>

        <!-- Lirios: 3 arriba, 2 abajo -->
        <div class="flower f1"></div>
        <div class="flower f2"></div>
        <div class="flower f3"></div>
        <div class="flower f4"></div>
        <div class="flower f5"></div>

        <!-- Papel de atrás -->
        <div class="paper paper-back"></div>

        <!-- Carritos Hot Wheels -->
        <img class="car car1" src="src/Hotwheels1.png" alt="Hot Wheels 1" />
        <img class="car car2" src="src/Hotwheels2.png" alt="Hot Wheels 2" />

        <!-- Papel de adelante -->
        <div class="paper paper-left"></div>
        <div class="paper paper-right"></div>

        <!-- Lazo -->
        <svg class="bow" viewBox="0 0 160 130" aria-hidden="true">
          <defs>
            <linearGradient id="lz1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b7bea"/><stop offset="1" stop-color="#12318a"/></linearGradient>
            <linearGradient id="lz2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a97f5"/><stop offset="1" stop-color="#15399c"/></linearGradient>
          </defs>
          <path d="M80 50 C60 105 50 120 36 128 L62 119 L72 127 C78 100 80 80 80 50Z" fill="#14337a" />
          <path d="M80 50 C100 105 110 120 124 128 L98 119 L88 127 C82 100 80 80 80 50Z" fill="#1b46a3" />
          <path d="M80 42 C50 2 2 8 6 40 C9 68 55 60 80 42Z" fill="url(#lz1)" />
          <path d="M80 42 C110 2 158 8 154 40 C151 68 105 60 80 42Z" fill="url(#lz2)" />
          <path d="M80 42 C50 20 24 20 18 38" fill="none" stroke="#b5d2ff" stroke-width="2.4" opacity=".55" />
          <path d="M80 42 C110 20 136 20 142 38" fill="none" stroke="#d2e3ff" stroke-width="2.4" opacity=".55" />
          <ellipse cx="80" cy="44" rx="13" ry="12" fill="#0f2a70" />
          <ellipse cx="76" cy="40" rx="5" ry="3.5" fill="#fff" opacity=".25" />
        </svg>
      </div>
      <div class="shadow"></div>
    </div>

    <div class="card">
      <p class="message" id="message"></p>
      <p class="days" id="days"></p>
      <p class="sign" id="sign"></p>
      <p class="hint">Toca las flores y los carritos ✨</p>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
